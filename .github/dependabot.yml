version: 2

registries:
  dhi-registry:
    type: docker-registry
    url: https://dhi.io
    # Matches the edipal Docker Hub namespace used in docker-build-publish.yml and
    # paired with the org-level DOCKERHUB_TOKEN Dependabot secret (no separate username secret exists).
    username: edipal
    # Requires DOCKERHUB_TOKEN to be configured in GitHub Dependabot Secrets.
    password: ${{ secrets.DOCKERHUB_TOKEN }}

updates:
  - package-ecosystem: "docker"
    directory: "/"
    registries:
      - dhi-registry
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    # Keep major dhi.io/flyway updates ungrouped (not ignored) so major Flyway
    # releases surface as separate manual-review PRs while auto-merge skips semver-major.
    groups:
      docker-images:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
